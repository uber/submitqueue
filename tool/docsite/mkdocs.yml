site_name: SubmitQueue
site_description: A speculative submission queue that keeps trunk green at scale.
site_url: https://uber.github.io/submitqueue/
repo_url: https://github.com/uber/submitqueue
repo_name: uber/submitqueue
edit_uri: edit/main/doc/

docs_dir: ../../doc
site_dir: build
strict: true

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: material/source-merge
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/nav_titles.py
  - hooks/repo_links.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uber/submitqueue
      name: GitHub
    - icon: fontawesome/brands/slack
      link: https://join.slack.com/t/submitqueue/shared_invite/zt-46gkqj682-7zcQphxm2pYqkjDo9lbmYA
      name: Slack community

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
