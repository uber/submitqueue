syntax = "proto3";

package uber.submitqueue.stovepipe;

option go_package = "github.com/uber/submitqueue/api/stovepipe/protopb";
option java_multiple_files = true;
option java_outer_classname = "StovepipeProto";
option java_package = "com.uber.submitqueue.stovepipe";

// PingRequest is the request for the Ping method
message PingRequest {
    // Optional message to include in the ping
    string message = 1;
}

// PingResponse is the response for the Ping method
message PingResponse {
    // The response message
    string message = 1;
    // The service name that handled the request
    string service_name = 2;
    // Timestamp of when the ping was received
    int64 timestamp = 3;
    // Hostname of the server that handled the request
    string hostname = 4;
}

// IngestRequest is the request for the Ingest method. The poller reports that a queue
// (a named repo+ref) has a new commit to validate.
message IngestRequest {
    // Logical queue name to validate (e.g. "monorepo/main"). It namespaces the minted
    // request ID and is the stable handle for the repo+ref being validated.
    string queue = 1;
}

// IngestResponse is the response for the Ingest method.
message IngestResponse {
    // The minted request ID, namespaced by queue. Format: "request/<queue>/<counter>"
    // (e.g. "request/monorepo/main/42").
    string id = 1;
}

// GetRequestHistoryByIDRequest selects one request history by the ID returned from Ingest.
message GetRequestHistoryByIDRequest {
    // Logical queue containing the request.
    string queue = 1;
    // Globally unique request identifier returned from Ingest.
    string request_id = 2;
}

// GetRequestHistoryByURIRequest selects retained request histories for an exact commit URI.
message GetRequestHistoryByURIRequest {
    // Logical queue containing the request.
    string queue = 1;
    // Exact VCS-agnostic commit URI whose request histories are selected.
    string uri = 2;
}

// HistoryEvent is one retained request state or lifecycle event.
message HistoryEvent {
    // Opaque stable identity of this logical occurrence within the request.
    string event_id = 1;
    // Occurrence time in Unix milliseconds.
    int64 timestamp_ms = 2;
    // Exactly one occurrence kind is populated.
    oneof occurrence {
        // Durable request state reached by the request.
        string request_state = 3;
        // Event that occurred without changing the request state.
        string event = 4;
    }
    // Stable domain reason for a terminal request outcome. Empty otherwise.
    string outcome_reason = 5;
}

// RequestHistory identifies one request and contains its ordered events.
message RequestHistory {
    // Globally unique request identifier.
    string request_id = 1;
    // Events ordered by occurrence time and stable event identity.
    repeated HistoryEvent events = 2;
}

// GetRequestHistoryByIDResponse contains all retained events for one request.
message GetRequestHistoryByIDResponse {
    // Events ordered by occurrence time and stable event identity.
    repeated HistoryEvent events = 1;
}

// GetRequestHistoryByURIResponse contains all retained request histories for an exact URI.
message GetRequestHistoryByURIResponse {
    // Histories ordered by numeric request-ID counter, then request ID.
    repeated RequestHistory histories = 1;
}

// GetProjectStatusByURIRequest selects the validation status for an exact commit URI.
message GetProjectStatusByURIRequest {
    // Logical queue containing the validation request.
    string queue = 1;
    // Exact VCS-agnostic URI of the commit under validation.
    string change_uri = 2;
    // Required consumer-defined project IDs whose recorded results are requested.
    repeated string projects = 3;
    // Maximum requested projects to return in one page. Zero selects the server default.
    int32 page_size = 4;
    // Opaque continuation token for requested-project result pagination.
    string page_token = 5;
}

// ProjectValidation contains one reported project and its recorded result, if any.
message ProjectValidation {
    // Stable consumer-defined project identifier.
    string project = 1;
    // Breakage degree on [0.0, 1.0]. Zero is green; absence means no result is recorded yet.
    oneof result {
        double breakage_degree = 2;
    }
}

// GetProjectStatusByURIResponse contains the selected validation's current projection.
message GetProjectStatusByURIResponse {
    // Globally unique identifier of the validation request.
    string request_id = 1;
    // Logical queue containing the validation request.
    string queue = 2;
    // VCS-agnostic URI of the commit under validation.
    string change_uri = 3;
    // Baseline URI for incremental validation. Empty for a full build.
    string base_uri = 4;
    // Stable public lifecycle state of the validation request.
    string request_state = 5;
    // Unix millisecond timestamp of the newest durable lifecycle or result record.
    int64 updated_at_ms = 10;
    // Whole-repository breakage degree. Absent until the result is durable.
    oneof repository_result {
        double repository_breakage_degree = 6;
    }
    // True after the implementation has durably finished producing relevant project results.
    bool project_results_complete = 7;
    // Recorded results for requested projects.
    repeated ProjectValidation projects = 8;
    // Opaque continuation token for another requested-project result page. Empty on the final page.
    string next_page_token = 9;
}

// RequestSummary contains one request's current materialized lifecycle state.
message RequestSummary {
    // Opaque identifier returned from Ingest.
    string request_id = 1;
    // Queue containing the request.
    string queue = 2;
    // Exact VCS-agnostic URI of the ingested commit.
    string change_uri = 3;
    // Selected baseline URI. Empty before selection or for a full build.
    string base_uri = 4;
    // Stable public lifecycle state; clients tolerate future values.
    string request_state = 5;
    // Unix millisecond timestamp of the represented state entry.
    int64 state_updated_at_ms = 6;
    oneof acceptance_time {
        // Immutable original accepted-log timestamp in Unix milliseconds; absent if unknown.
        int64 accepted_at_ms = 7;
    }
    // Stable reason for the represented state. Empty when unavailable or inapplicable.
    string outcome_reason = 8;
}

// ListOrder selects the immutable ordering key for request listing.
enum ListOrder {
    // Descending numeric per-queue request sequence.
    REQUEST_ID_DESC = 0;
    // Descending acceptance time, then bytewise descending request ID.
    ACCEPTED_AT_DESC = 1;
}

// ListRequest selects a page of retained request summaries for one queue.
message ListRequest {
    // Required configured queue.
    string queue = 1;
    // Ordering for every page. Defaults to request-ID order.
    ListOrder order = 2;
    oneof accepted_lower_bound {
        // Inclusive Unix millisecond bound. Time order only; omitted defaults to zero.
        int64 accepted_at_or_after_ms = 3;
    }
    oneof accepted_upper_bound {
        // Exclusive Unix millisecond bound. Time order only; omitted defaults to server now.
        int64 accepted_before_ms = 4;
    }
    // Zero selects 50; nonzero values must be between 1 and 200.
    int32 page_size = 5;
    // Opaque continuation token bound to the queue, order, and resolved time bounds.
    string page_token = 6;
}

// ListResponse contains a page in the requested order, not a snapshot across pages.
message ListResponse {
    // Current summaries in the selected order.
    repeated RequestSummary requests = 1;
    // Opaque continuation token; empty when no further row was observed.
    string next_page_token = 2;
    oneof accepted_lower_bound {
        // Resolved inclusive Unix millisecond bound; absent in request-ID order.
        int64 accepted_at_or_after_ms = 3;
    }
    oneof accepted_upper_bound {
        // Resolved exclusive Unix millisecond bound, fixed across pages; absent in request-ID order.
        int64 accepted_before_ms = 4;
    }
}

// Stovepipe provides the Stovepipe API.
service Stovepipe {
    // Ping returns a response indicating the service is alive
    rpc Ping(PingRequest) returns (PingResponse) {}
    // Ingest admits a queue's newly observed commit into the validation pipeline and returns
    // the minted request ID. The caller hands off asynchronously; validation happens later.
    rpc Ingest(IngestRequest) returns (IngestResponse) {}
    // GetRequestHistoryByID returns retained history for one request ID.
    rpc GetRequestHistoryByID(GetRequestHistoryByIDRequest) returns (GetRequestHistoryByIDResponse) {}
    // GetRequestHistoryByURI returns retained histories for an exact commit URI.
    rpc GetRequestHistoryByURI(GetRequestHistoryByURIRequest) returns (GetRequestHistoryByURIResponse) {}
    // GetProjectStatusByURI returns the current validation status for an exact commit URI.
    rpc GetProjectStatusByURI(GetProjectStatusByURIRequest) returns (GetProjectStatusByURIResponse) {}
    // List returns a queue-scoped page of current request summaries.
    rpc List(ListRequest) returns (ListResponse) {}
}
