# Local web overlay: the host connects to Stovepipe on Compose's private network.
services:
  web-service:
    image: ${STOVEPIPE_WEB_IMAGE:-stovepipe-web-service:latest}
    platform: linux/amd64
    ports:
      - "3000"
    environment:
      STOVEPIPE_URL: http://stovepipe-service:8080
      STOVEPIPE_ALLOW_PLAINTEXT: "true"
      STOVEPIPE_WEB_TOKEN: ${STOVEPIPE_WEB_TOKEN:-test}
      STOVEPIPE_WEB_QUEUES: ${STOVEPIPE_WEB_QUEUES:-[{"name":"monorepo/main"},{"name":"monorepo/release"},{"name":"monorepo/slow"}]}
    depends_on:
      stovepipe-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
