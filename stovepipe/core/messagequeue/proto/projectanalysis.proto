syntax = "proto3";

package uber.stovepipe.messagequeue;

import "api/base/messagequeue/proto/messagequeue.proto";

option go_package = "github.com/uber/submitqueue/stovepipe/core/messagequeue/protopb";
option java_multiple_files = true;
option java_outer_classname = "ProjectAnalysisProto";
option java_package = "com.uber.submitqueue.stovepipe.messagequeue";

// ProjectAnalysis identifies a terminal validation whose final build issues are durable.
// Partitioned by request ID.
message ProjectAnalysis {
    option (uber.base.messagequeue.topic_keys) = "projectanalysis";

    // id is the canonical positive decimal request ID within the queue.
    string id = 1;
    // queue_name identifies the configured validation queue.
    string queue_name = 2;
}
