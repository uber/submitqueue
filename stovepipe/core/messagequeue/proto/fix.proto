syntax = "proto3";

package uber.stovepipe.messagequeue;

import "api/base/messagequeue/proto/messagequeue.proto";

option go_package = "github.com/uber/submitqueue/stovepipe/core/messagequeue/protopb";
option java_multiple_files = true;
option java_outer_classname = "FixRequestProto";
option java_package = "com.uber.submitqueue.stovepipe.messagequeue";

// FixRequest identifies a confirmed issue opening and the build requesting repair.
// The observation and open issue must be persisted before publication.
message FixRequest {
    option (uber.base.messagequeue.topic_keys) = "fix";

    string queue_name = 1;
    string build_id = 2;
    string task_id = 3;
    string unit_id = 4;
    string first_seen_build_id = 5;
}
