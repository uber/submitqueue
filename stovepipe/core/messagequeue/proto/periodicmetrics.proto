syntax = "proto3";

package uber.stovepipe.messagequeue;

import "api/base/messagequeue/proto/messagequeue.proto";

option go_package = "github.com/uber/submitqueue/stovepipe/core/messagequeue/protopb";
option java_multiple_files = true;
option java_outer_classname = "PeriodicMetricsProto";
option java_package = "com.uber.submitqueue.stovepipe.messagequeue";

// PeriodicMetrics asks for one observation of a queue's current health, emitted as
// metrics. Unlike every other payload on Stovepipe's pipeline queues, no stage
// produces it: the deployment publishes it on a schedule. That is the point — the
// health it reports (how stale the queue's last-known-green commit is) degrades
// while the pipeline is idle, so an observation triggered by pipeline activity goes
// quiet in exactly the outage worth alerting on.
//
// The payload carries no request or build id because it observes the queue rather
// than any one unit of work. Redelivery is harmless: a repeated observation
// overwrites the same current-state gauge.
message PeriodicMetrics {
    option (uber.base.messagequeue.topic_keys) = "periodicmetrics";

    // queue_name is the name of the queue to observe (e.g. "monorepo/main").
    string queue_name = 1;
}
