# Compose overlay: point the stack at a real provider.
#
# Layered on top of docker-compose.yml, which it does not modify:
#
#   docker compose -f docker-compose.yml -f docker-compose.provider.yml up
#
# or, more simply, `make local-submitqueue-start PROVIDER=github`.
#
# Nothing here names a provider. Which one is reached is decided entirely by the
# configuration directory bind-mounted at /etc/submitqueue — see
# demo/provider/<name>/ — so adding a provider needs no change to this file.
#
# Required in the environment:
#   SQ_PROVIDER_CONFIG_DIR  directory holding profiles.yaml and merge.yaml
#   GITHUB_TOKEN         (for the github example) the credential named by
#                        tokenEnv in those files
#
# The token is required rather than defaulted: falling back to the fake
# integrations would let the stack report a change as landed without having gone
# anywhere near the provider, which is a far worse failure than not starting.

services:
  orchestrator-service:
    environment:
      # Which change provider, build runner, and conflict analyzer each queue
      # resolves to.
      - PROFILES_CONFIG_PATH=/etc/submitqueue/profiles.yaml
      # Read by the change provider and, if configured, the CI build runner.
      - GITHUB_TOKEN=${GITHUB_TOKEN:?set GITHUB_TOKEN to reach the provider}
    volumes:
      - ${SQ_PROVIDER_CONFIG_DIR:?set SQ_PROVIDER_CONFIG_DIR, e.g. ./service/submitqueue/demo/provider/github}:/etc/submitqueue:ro

  runway-service:
    environment:
      # Per-queue merge targets. Without this Runway falls back to the noop
      # merger and nothing is ever pushed.
      - MERGE_CONFIG_PATH=/etc/submitqueue/merge.yaml
      # Used to clone, fetch, and push. Written into the checkout as an HTTP
      # Authorization header, never into the remote URL.
      - GITHUB_TOKEN=${GITHUB_TOKEN:?set GITHUB_TOKEN to reach the provider}
    volumes:
      - ${SQ_PROVIDER_CONFIG_DIR:?set SQ_PROVIDER_CONFIG_DIR, e.g. ./service/submitqueue/demo/provider/github}:/etc/submitqueue:ro
      # Working trees the merger owns. A named volume so a restart re-uses the
      # clone instead of fetching the repository again.
      - runway-checkouts:/var/runway/checkouts

volumes:
  runway-checkouts:
