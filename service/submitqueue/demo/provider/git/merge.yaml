# Merge targets for the "git" example: a plain git remote with no provider.
#
# The target is a bare repository on a shared volume, addressed by path. That
# exercises the whole merge machinery (real fetch, cherry-pick, push,
# head-branch update) with no credential, no network, and no provider account,
# which is what lets the hermetic git E2E (`make e2e-git-test`) gate PRs in CI.
#
# It doubles as the worked example of a non-GitHub target: nothing below names a
# provider, because the merger does not have one. See ../README.md.

defaults:
  # Any queue without an entry below does not merge for real.
  merger: {type: noop}

queues:
  # The queue `make demo-requests` and `make land` use by default. Squash-rebases to
  # match the GitHub demo, so switching providers changes where changes come
  # from and not what landing does to them.
  - name: demo-queue
    merger:
      type: git
      # A local path needs no credential, so no tokenEnv is named.
      remoteUrl: file:///srv/git/sandbox.git
      remote: origin
      target: main
      # Deliberately not e2e-git-queue's working tree. Queues sharing a checkout
      # share a single merger instance, so two differing configurations pointing
      # at one checkout is refused at startup.
      checkoutPath: /var/runway/checkouts/demo
      defaultStrategy: SQUASH_REBASE
      checkStaleness: true
      # Rewriting strategies leave the change's original head unreachable from
      # the target, so its branch is moved to the commit it landed as. On a
      # provider this is what makes the change show as merged; here it is simply
      # observable as the branch having moved.
      updateHeadBranch: true

  # Driven by the E2E, which asserts against the repository itself — what
  # reached the target branch, in what order, and in how many ref updates. These
  # settings are what those assertions expect.
  - name: e2e-git-queue
    merger:
      type: git
      remoteUrl: file:///srv/git/sandbox.git
      remote: origin
      target: main
      # Provisioned at startup: cloned, remote configured, target checked out.
      checkoutPath: /var/runway/checkouts/sandbox
      defaultStrategy: REBASE
      checkStaleness: true
      updateHeadBranch: true
