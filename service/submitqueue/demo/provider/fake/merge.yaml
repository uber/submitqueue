# Merge targets for the "fake" example: there are none.
#
# Nothing here merges. The noop merger reports success without touching a
# repository, which is what lets a request reach `landed` with no repository to
# land into.
#
# That is the mode's limit, and worth knowing before reading anything into a
# green run: `landed` here means the pipeline ran to completion, not that a
# commit exists anywhere. Switch to PROVIDER=git for a real merge into a local
# repository, still without a credential — see ../git/merge.yaml.

defaults:
  merger: {type: noop}
