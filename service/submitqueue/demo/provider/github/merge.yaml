# Merge targets for the GitHub demo.
#
# Edit the three placeholders below to point at your own scratch repository,
# then: make local-submitqueue-start PROVIDER=github
#
# This file holds no secret. `tokenEnv` names the environment variable carrying
# the credential, so the file stays committable and rotating the token needs no
# edit here.

defaults:
  # Any queue without an entry below does not merge for real, so a typo in a
  # queue name fails safe rather than landing somewhere unintended.
  merger: {type: noop}

queues:
  - name: demo-queue
    merger:
      type: git
      # ---- point these at your own scratch repo ----
      remoteUrl: https://github.com/behinddwalls/sq-demo.git
      target: main
      checkoutPath: /var/runway/checkouts/sq-demo
      # --------------------------

      remote: origin
      # SQUASH_REBASE collapses each pull request to one commit on the target.
      # REBASE keeps every commit; MERGE preserves the original hashes under a
      # merge commit; PROMOTE fast-forwards to an existing commit.
      defaultStrategy: SQUASH_REBASE
      # Refuse a change whose head has moved since it was submitted, rather
      # than landing a commit nobody is looking at any more.
      checkStaleness: true
      # The credential for cloning, fetching, and pushing. Written into the
      # checkout as an HTTP Authorization header — never into the remote URL,
      # which git would echo back in error messages.
      #
      # For SSH instead, drop tokenEnv, use an ssh:// remoteUrl, and mount a
      # deploy key: the merger already passes SSH_AUTH_SOCK and
      # GIT_SSH_COMMAND through to git.
      tokenEnv: GITHUB_TOKEN
