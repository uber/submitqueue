# Extension profiles for the GitHub demo.
#
# Selects which implementation of each extension every queue resolves to. Holds
# no secret: each integration names the environment variable carrying its
# credential.

defaults:
  # Fake everywhere by default, so a queue that is not listed below cannot
  # reach GitHub by accident.
  changeProvider: {type: fake}
  buildRunner: {type: fake}
  analyzer: {type: all}

queues:
  - name: demo-queue
    # Reads pull request metadata from GitHub's GraphQL API. For GitHub
    # Enterprise, add `github: {baseUrl: https://ghe.example.com/api/v3}`.
    changeProvider: {type: github}

    # Serializes batches that touch a shared directory, so changes land in
    # parallel unless they land in the same folder. Keys on the immediate parent
    # directory, and files at the repository root all share one key. Use
    # `by: file` to conflict only on the same file, {type: all} to serialize the
    # queue entirely, or {type: none} for maximum parallelism with no conflict
    # detection.
    analyzer: {type: pathoverlap, by: directory}

    # Real CI. Each speculative batch is a workflow_dispatch, polled to
    # completion, so `landed` here means a build of that batch passed rather
    # than that a fake said so — this is the one rung where nothing is faked.
    #
    # The cost is honest too: a land takes as long as the workflow does, and
    # every speculation path dispatched is Actions minutes spent. Set the build
    # budget accordingly — see `speculator: {buildBudget: N}`.
    #
    # ---- point these at your own scratch repo ----
    buildRunner:
      type: githubactions
      owner: behinddwalls
      repo: sq-demo
      # File name or numeric id. The workflow must declare workflow_dispatch and
      # accept the four sq_* inputs; a workflow triggered only by pull_request
      # cannot be dispatched at all and GitHub rejects the call.
      workflow: ci.yml
      # The branch the workflow definition is read from, not the code under test.
      ref: main
    # ----------------------------------------------
