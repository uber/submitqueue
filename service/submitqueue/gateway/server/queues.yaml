# Example queue configurations consumed by the gateway YAML store.
# The gateway loads this file at startup; QUEUE_CONFIG_PATH must point at it.
# QueueConfig is just the registry of valid queue names — all behavioral and
# VCS configuration lives in the extension factory implementations wired in the
# server, not here.
queues:
  - name: test-queue
  - name: e2e-test-queue
  - name: e2e-cancel-queue
  # Not listed in the orchestrator's per-queue profiles, so it falls through to
  # the baseline profile and its "all" conflict analyzer: every new batch
  # serializes behind every in-flight one. That is what lets e2e build a
  # dependency chain and exercise how a dependent is woken.
  - name: e2e-chain-queue
  # Routes to an analyzer that always errors (conflictfake.FailAlways) so e2e can
  # exercise the conflict-analysis error path. See newQueueRegistry in the
  # orchestrator example server.
  - name: e2e-conflict-error-queue
  # Used by the hermetic git E2E, where Runway is wired to a real git merger
  # against a bare repository. See service/submitqueue/demo/provider/local.
  - name: e2e-git-queue
  # Used by the provider demo stack (make local-provider-start), where the whole
  # pipeline runs against a real repository. See
  # service/submitqueue/demo/provider and doc/howto/PROVIDER-E2E.md.
  - name: demo-queue
