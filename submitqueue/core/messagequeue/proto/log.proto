syntax = "proto3";

package uber.submitqueue.messagequeue;

import "api/base/messagequeue/proto/messagequeue.proto";

option go_package = "github.com/uber/submitqueue/submitqueue/core/messagequeue/protopb";
option java_multiple_files = true;
option java_outer_classname = "LogProto";
option java_package = "com.uber.submitqueue.submitqueue.messagequeue";

// Log is the payload orchestrator stages publish to the log stage: a full
// request-log entry. The gateway materializes it; the seam crosses services, so
// the entry travels in full. type, status, and event are open strings matching
// the domain vocabularies (not proto enums), so additive values do not break
// existing consumers.
message Log {
    option (uber.base.messagequeue.topic_keys) = "log";

    // request_id is the request this entry belongs to.
    string request_id = 1;
    // queue is the name of the queue processing the request.
    string queue = 2;
    // timestamp_ms is when this entry was created, milliseconds since Unix epoch.
    int64 timestamp_ms = 3;
    // type is "status" or "event". An empty type is treated as "status".
    string type = 4;
    // status is the request status this entry records. Set only when type is "status".
    string status = 5;
    // event is the event this entry records. Set only when type is "event".
    string event = 6;
    // request_version is the request entity version at this entry, or zero.
    int32 request_version = 7;
    // last_error is the last error message associated with the status, or empty.
    string last_error = 8;
    // metadata is free-form additional context.
    map<string, string> metadata = 9;
}
