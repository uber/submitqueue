syntax = "proto3";

package uber.submitqueue.messagequeue;

import "api/base/messagequeue/proto/messagequeue.proto";

option go_package = "github.com/uber/submitqueue/submitqueue/core/messagequeue/protopb";
option java_multiple_files = true;
option java_outer_classname = "SubmitqueueBuildSignalProto";
option java_package = "com.uber.submitqueue.submitqueue.messagequeue";

// BuildSignal is the payload build publishes to the buildsignal stage: the id is a build id. buildsignal reloads the Build from storage.
message BuildSignal {
    option (uber.base.messagequeue.topic_keys) = "buildsignal";

    // id is the build id to poll.
    string id = 1;
    // queue is the name of the queue processing this work, carried so the
    // consumer can route by queue without loading state first. Empty on
    // payloads written before the field existed.
    string queue = 2;
}
